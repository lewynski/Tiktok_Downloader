<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PixelSaver - 8-Bit TikTok Downloader</title>
  
  <!-- Import 8-Bit Font mula sa Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    /* 8-Bit Retro Styling */
    :root {
      --bg-color: #000000;
      --container-bg: #1a1a2e;
      --text-main: #ffffff;
      --text-dim: #aaaaaa;
      --accent-cyan: #00ffff;
      --accent-magenta: #ff00ff;
      --accent-green: #39ff14;
      --accent-red: #ff003c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Press Start 2P', monospace; /* Pixel Font */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image: 
        linear-gradient(#222 1px, transparent 1px),
        linear-gradient(90deg, #222 1px, transparent 1px);
      background-size: 20px 20px; /* Grid background effect */
    }

    .pixel-container {
      background-color: var(--container-bg);
      border: 4px solid var(--text-main);
      box-shadow: 10px 10px 0px var(--accent-magenta);
      padding: 40px 30px;
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      color: var(--accent-cyan);
      text-shadow: 4px 4px 0px var(--accent-red);
      margin-bottom: 15px;
      line-height: 1.4;
    }

    p {
      font-size: 10px;
      color: var(--text-dim);
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    input[type="url"] {
      width: 100%;
      background: #000;
      border: 4px solid var(--text-main);
      color: var(--accent-green);
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 15px;
      outline: none;
    }

    input[type="url"]:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
    }

    input::placeholder {
      color: #555555;
    }

    button {
      background: var(--accent-magenta);
      color: var(--text-main);
      border: 4px solid var(--text-main);
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      padding: 15px;
      cursor: pointer;
      box-shadow: 6px 6px 0px var(--accent-cyan);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    button:hover:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 4px 4px 0px var(--accent-cyan);
    }

    button:active:not(:disabled) {
      transform: translate(6px, 6px);
      box-shadow: 0px 0px 0px var(--accent-cyan);
    }

    button:disabled {
      background: #555;
      box-shadow: 6px 6px 0px #333;
      cursor: not-allowed;
    }

    .feedback {
      margin-top: 20px;
      font-size: 10px;
      color: yellow;
      min-height: 15px;
    }

    .feedback.error {
      color: var(--accent-red);
    }

    #result {
      display: none;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 4px dashed #555;
    }

    #result.visible {
      display: block;
    }

    #title {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 20px;
      word-wrap: break-word;
    }

    .save-btn {
      display: inline-block;
      background: var(--accent-green);
      color: #000;
      text-decoration: none;
      font-size: 12px;
      padding: 15px 20px;
      border: 4px solid var(--text-main);
      box-shadow: 6px 6px 0px var(--text-main);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .save-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 4px 4px 0px var(--text-main);
    }

    .save-btn:active {
      transform: translate(6px, 6px);
      box-shadow: 0px 0px 0px var(--text-main);
    }

    /* Blinking cursor effect */
    .blink {
      animation: blink-animation 1s steps(2, start) infinite;
    }
    @keyframes blink-animation {
      to { visibility: hidden; }
    }
  </style>
</head>
<body>

  <div class="pixel-container">
    <h1>PIXEL<br>SAVER</h1>
    <p>INSERT COIN (or TikTok URL) TO CONTINUE...</p>

    <form id="form" novalidate>
      <div class="form-group">
        <input 
          id="url" 
          type="url" 
          placeholder="HTTPS://TIKTOK.COM/..." 
          required 
        />
        <button id="btn" type="submit">GET VIDEO <span class="blink">_</span></button>
      </div>
    </form>

    <div id="feedback" class="feedback"></div>

    <div id="result">
      <div id="title">LEVEL COMPLETE!</div>
      <!-- Dadaan ito sa /api/download?stream=true para rekta download -->
      <a id="download" class="save-btn" href="#">DOWNLOAD .MP4</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('url');
    const btn = document.getElementById('btn');
    const feedback = document.getElementById('feedback');
    const result = document.getElementById('result');
    const title = document.getElementById('title');
    const download = document.getElementById('download');

    function showFeedback(message, isError = false) {
      feedback.textContent = message;
      feedback.className = `feedback ${isError ? 'error' : ''}`;
    }

    function isTikTokUrl(raw) {
      try {
        const url = new URL(raw);
        const host = url.hostname.toLowerCase();
        return url.protocol === 'https:' && (host === 'tiktok.com' || host.endsWith('.tiktok.com') || host.endsWith('vt.tiktok.com'));
      } catch { 
        return false; 
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const url = input.value.trim();
      result.classList.remove('visible');
      feedback.textContent = '';

      if (!isTikTokUrl(url)) {
        showFeedback('INVALID URL! PLEASE TRY AGAIN.', true);
        input.focus();
        return;
      }

      btn.disabled = true;
      btn.innerHTML = 'LOADING...';
      showFeedback('FETCHING DATA FROM SERVER...');

      try {
        // Step 1: Kunin ang data mula sa backend
        const response = await fetch(`/api/download?url=${encodeURIComponent(url)}`);
        
        let data;
        try { 
          data = await response.json(); 
        } catch { 
          throw new Error('SERVER ERROR.'); 
        }

        if (!response.ok) throw new Error(typeof data.error === 'string' ? data.error : 'MISSION FAILED.');
        
        const targetUrl = data.videoUrl || data.downloadUrl;
        if (!targetUrl) throw new Error('VIDEO NOT FOUND.');

        // Step 2: I-set ang title at ilagay ang stream URL sa Download button
        title.textContent = typeof data.title === 'string' && data.title ? data.title.toUpperCase() : 'TIKTOK VIDEO READY';
        
        // Ito ang magpapatakbo ng rekta download fix mo!
        download.href = `/api/download?stream=${encodeURIComponent(targetUrl)}`;
        
        result.classList.add('visible');
        showFeedback('SUCCESS!');
        
      } catch (error) {
        showFeedback(error instanceof Error ? error.message.toUpperCase() : 'GAME OVER. TRY AGAIN.', true);
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'GET VIDEO <span class="blink">_</span>';
      }
    });
  </script>

</body>
</html>
